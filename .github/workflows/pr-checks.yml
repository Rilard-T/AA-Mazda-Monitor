name: ci
on:
  pull_request: {}
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 19

      - uses: gradle/actions/setup-gradle@v4

      - name: test
        run: |
          touch local.properties && chmod +x gradlew && \
          ./gradlew testStableDebugUnitTest testNavDebugUnitTest lintNavDebug --no-daemon --stacktrace