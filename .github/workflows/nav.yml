name: nav
# Сборка nav-приложения (AA Dash Nav) и публикация релиза по пушу.
on:
  push:
    branches: [beta, nav]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 19
      - uses: gradle/actions/setup-gradle@v4
      - name: keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore" && echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: bump build number
        run: sed -i "s/^buildNumber=.*/buildNumber=$GITHUB_RUN_NUMBER/" version.properties && cat version.properties
      - name: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: touch local.properties && chmod +x gradlew && ./gradlew assembleNavRelease
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v() { grep -E "^$1" version.properties | cut -d= -f2 | tr -d '[:space:]'; }
          tag="nav-$(v majorVersion).$(v minorVersion).$(v patchVersion)-$GITHUB_RUN_NUMBER"
          # Правки заметок уже вышедших релизов: docs/release-notes-nav-<tag>.md.
          for f in docs/release-notes-nav-*.md; do
            [ -f "$f" ] || continue
            t="nav-${f#docs/release-notes-nav-}"
            t="${t%.md}"
            if gh release view "$t" >/dev/null 2>&1; then
              gh release edit "$t" --notes-file "$f"
            fi
          done
          {
            # К релизу прикладываются только списки изменений на двух языках.
            cat docs/release-notes-nav.md
          } > "$RUNNER_TEMP/release-notes.md"
          # --latest=false: /releases/latest должен оставаться за стабильным каналом master.
          gh release create "$tag" app/build/outputs/apk/nav/release/*.apk \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest=false
          # Постоянный ярлык nav-latest: на него ведут ссылки скачивания в README.
          # Файл перезаписывается каждой сборкой, поэтому README не нужно править.
          apk=$(ls app/build/outputs/apk/nav/release/*.apk | head -n1)
          if gh release view nav-latest >/dev/null 2>&1; then
            gh release upload nav-latest "$apk" --clobber
          else
            gh release create nav-latest "$apk" \
              --target "$GITHUB_SHA" --title "AA Dash Nav — последняя сборка" \
              --notes "Последняя сборка канала nav. Файл обновляется автоматически." \
              --prerelease
          fi
          # GitHub вешает бейдж Latest на последний созданный релиз, то есть на сборку nav,
          # и /releases/latest (ссылка на стабильный APK в README) уезжает на неё.
          # Возвращаем бейдж самому свежему стабильному тегу с опубликованным релизом.
          stable=""
          for t in $(git ls-remote --tags origin 'refs/tags/*' \
            | sed 's|.*refs/tags/||; s|\^{}$||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uVr); do
            if [ -n "$(gh release view "$t" --json isDraft,isPrerelease \
                  -q 'select(.isDraft == false and .isPrerelease == false) | .tagName')" ]; then
              stable="$t"
              break
            fi
          done
          if [ -n "$stable" ]; then
            gh release edit "$stable" --latest
            echo "Latest → $stable"
          else
            echo "Опубликованных стабильных релизов нет, Latest не трогаем"
          fi
