{"name": "navproto", "on": {"push": {"branches": ["navproto"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"navproto": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4", "with": {"submodules": "recursive"}}, {"uses": "actions/setup-java@v4", "with": {"distribution": "zulu", "java-version": 19}}, {"uses": "gradle/actions/setup-gradle@v4"}, {"name": "keystore", "env": {"KS": "${{ secrets.KEYSTORE_B64 }}"}, "run": "echo \"$KS\" | base64 -d > \"$RUNNER_TEMP/release.keystore\" && echo \"KEYSTORE_FILE=$RUNNER_TEMP/release.keystore\" >> \"$GITHUB_ENV\""}, {"name": "build", "env": {"KEYSTORE_PASSWORD": "${{ secrets.KEYSTORE_PASSWORD }}", "KEY_ALIAS": "${{ secrets.KEY_ALIAS }}", "KEY_PASSWORD": "${{ secrets.KEY_PASSWORD }}"}, "run": "touch local.properties && chmod +x gradlew && ./gradlew :navproto:assembleRelease"}, {"name": "publish", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "tag=\"navproto-$GITHUB_RUN_NUMBER\"; gh release create \"$tag\" navproto/build/outputs/apk/release/*.apk --prerelease --target \"$GITHUB_SHA\" --title \"$tag\" --notes \"AA Monitor Nav: прототип полноэкранного вывода через Car App Library\""}]}}}